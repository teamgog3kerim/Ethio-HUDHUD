providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
# Install pnpm explicitly below rather than relying on a host's Corepack
# signing keys or its Nix pnpm overlay version.
nixPkgs = ["nodejs_22"]

[phases.install]
paths = ["/opt/hudhud-tools/node_modules/.bin", "/app/node_modules/.bin"]
cmds = [
  "npm install --prefix /opt/hudhud-tools --no-package-lock --no-audit --no-fund pnpm@10.26.1",
  "node --version && pnpm --version",
  "pnpm install --frozen-lockfile --prod=false"
]

[phases.build]
cmds = ["pnpm run deploy:build"]

[start]
cmd = "pnpm run deploy:start"
