kind = "mobile"
previewPath = "/mobile/"
title = "Ethio HUDHUD Mobile"
description = "Native Android and iOS Amharic learning companion with Arabic explanations, Fidel lessons, review practice and saved learning progress."
version = "1.0.0"
id = "artifacts/hudhud-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 22796

[services.development]
run = "pnpm --filter @workspace/hudhud-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hudhud-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/hudhud-mobile", "run", "serve" ]

[services.env]
PORT = "22796"
BASE_PATH = "/mobile/"
