openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: Learner or guest profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      operationId: saveProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /course-catalog:
    get:
      operationId: getCourseCatalog
      description: Public course outlines only; no lessons, answers, progress or trial initialization.
      responses:
        "200":
          description: Public programme overview
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PublicCourseSummary" } }
  /courses:
    get:
      operationId: getCourses
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Course" } }
  /favourites:
    get:
      operationId: getFavourites
      tags: [Learning]
      description: Active saved lessons for the current account or signed guest session only.
      responses:
        "200":
          description: Saved lessons and conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lesson" }
  /favourites/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
    put:
      operationId: saveFavourite
      tags: [Learning]
      description: Idempotently save an active lesson under the server-resolved learner identity.
      responses:
        "204": { description: Saved }
        "404": { description: Lesson unavailable }
    delete:
      operationId: removeFavourite
      tags: [Learning]
      description: Idempotently remove this learner's save, including for an archived lesson.
      responses:
        "204": { description: Removed }
  /lessons/{id}:
    get:
      operationId: getLesson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
  /lessons/{id}/complete:
    post:
      operationId: completeLesson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonSubmission" }
      responses:
        "200":
          description: Server graded result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonResult" }
  /progress/summary:
    get:
      operationId: getProgress
      responses:
        "200":
          description: Actual learning progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
  /study-reminders:
    get:
      operationId: getStudyReminderStatus
      responses:
        "200":
          description: Account study reminder preferences and current scheduled occurrence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyReminderStatus" }
    put:
      operationId: saveStudyReminderSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyReminderSettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyReminderStatus" }
  /study-reminders/action:
    post:
      operationId: actOnStudyReminder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyReminderAction" }
      responses:
        "200":
          description: Reminder snoozed for ten minutes or dismissed for this occurrence; no learning progress changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyReminderStatus" }
  /study-reminders/devices/{deviceId}/revoke:
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: revokeStudyReminderDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderRevocationInput" }
      responses:
        "204": { description: Study device consent revoked using a disable-only capability }
  /study-reminders/devices/{deviceId}:
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getStudyReminderDevice
      responses:
        "200":
          description: This account's study notification registration on this device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderDeviceStatus" }
    put:
      operationId: saveStudyReminderDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderDeviceInput" }
      responses:
        "200":
          description: Study-only Web Push registration; never enables subscription reminders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderDeviceStatus" }
    delete:
      operationId: removeStudyReminderDevice
      responses:
        "204": { description: Study notifications disabled on this device }
  /study-schedule:
    put:
      operationId: saveStudySchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyScheduleInput" }
      responses:
        "200":
          description: Saved scheduling preferences; lesson progress is unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400":
          description: Invalid schedule
  /study-plan:
    get:
      operationId: getStudyPlan
      responses:
        "200":
          description: Six month plan
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PlanDay" } }
  /vocabulary:
    get:
      operationId: getVocabulary
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Word" } }
  /vocabulary/{id}/review:
    post:
      operationId: reviewVocabulary
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Review scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Word" }
  /ai/chat:
    get:
      operationId: getChat
      responses:
        "200":
          description: Private tutor history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
    post:
      operationId: sendChat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatInput" }
      responses:
        "200":
          description: Tutor reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
    delete:
      operationId: clearChat
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /billing/polar/live/checkout:
    post:
      operationId: createLiveCheckout
      summary: Start an account-bound live checkout only after explicit launch approval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolarCheckoutInput" }
      responses:
        "200":
          description: Live checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolarCheckout" }
        "401": { description: Sign in required }
        "403": { description: Verified email and active account required }
        "409": { description: Existing or unresolved purchase }
        "503": { description: Checkout not enabled or monthly cap not approved }
  /billing/polar/live/checkout/{id}:
    get:
      operationId: getLiveCheckout
      summary: Verify the signed-in account's purchase against current Polar state
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Verified live checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolarCheckout" }
        "401": { description: Sign in required }
        "404": { description: Checkout not owned by this account }
        "502": { description: Provider verification unavailable }
  /billing/polar/live/portal:
    post:
      operationId: createLivePortal
      summary: Open the signed-in purchaser's billing portal
      responses:
        "200":
          description: Live customer portal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolarPortal" }
        "401": { description: Sign in required }
        "404": { description: No live purchase for this account }
  /billing/polar/live/webhook:
    post:
      operationId: receiveLivePolarWebhook
      summary: Verify raw signed live Polar bytes and durably queue a receipt; never grants access by itself
      parameters:
        - { name: webhook-id, in: header, required: true, schema: { type: string, maxLength: 255 } }
        - { name: webhook-timestamp, in: header, required: true, schema: { type: string } }
        - { name: webhook-signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolarWebhookEnvelope" }
      responses:
        "202": { description: Receipt durably queued or duplicate acknowledged; not a paid entitlement }
        "400": { description: Invalid JSON resource }
        "403": { description: "Invalid, expired or unsupported signed webhook" }
        "409": { description: Same event ID reused with different payload bytes }
        "413": { description: Request too large }
        "429": { description: Rate limit reached; retry later }
        "503": { description: Live webhook signing secret not configured }
  /billing/polar/sandbox/webhook:
    post:
      operationId: receiveSandboxWebhook
      summary: Receive a signed Polar sandbox event; raw bytes verified by the Polar SDK
      parameters:
        - { name: webhook-id, in: header, required: true, schema: { type: string } }
        - { name: webhook-timestamp, in: header, required: true, schema: { type: string } }
        - { name: webhook-signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolarWebhookEnvelope" }
      responses:
        "202": { description: Event processed or safely ignored }
        "403": { description: Invalid signature }
        "503": { description: Sandbox webhook not configured }
  /billing/polar/sandbox/checkout:
    post:
      operationId: createSandboxCheckout
      summary: Create a signed-in learner's Polar sandbox checkout; never charges real money
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolarCheckoutInput" }
      responses:
        "200":
          description: Sandbox checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolarCheckout" }
        "401": { description: Sign in required }
        "409": { description: Existing purchase or pending checkout }
        "503": { description: Sandbox not ready }
  /billing/polar/sandbox/checkout/{id}:
    get:
      operationId: getSandboxCheckout
      summary: Verify this account's sandbox checkout against Polar
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Server-verified sandbox result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolarCheckout" }
        "401": { description: Sign in required }
        "404": { description: Checkout not owned by this account }
  /billing/polar/sandbox/portal:
    post:
      operationId: createSandboxPortal
      summary: Open this signed-in learner's Polar sandbox billing portal
      responses:
        "200":
          description: Sandbox customer portal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolarPortal" }
  /billing/selection:
    post:
      operationId: selectCoursePlan
      tags: [learning]
      summary: Save a signed-in learner's plan preference without activating payment or restarting trial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanSelectionInput" }
      responses:
        "200":
          description: Saved preference and current access status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
        "400":
          description: Invalid plan
        "401":
          description: Sign in required
  /billing/reminder-device/{deviceId}/revoke:
    post:
      operationId: revokeReminderDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderRevocationInput" }
      responses:
        "204": { description: "Matching account-device consent revoked, including after account switches" }
  /billing/reminder-device/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getReminderDevice
      responses:
        "200":
          description: Delivery configuration and this account's device status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderDeviceStatus" }
    put:
      operationId: saveReminderDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderDeviceInput" }
      responses:
        "200":
          description: Consent saved for this installation and signed-in account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderDeviceStatus" }
    delete:
      operationId: removeReminderDevice
      responses:
        "204": { description: Background reminders disabled for this device }
  /billing/status:
    get:
      operationId: getBillingStatus
      responses:
        "200":
          description: Verified subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
  /account/export:
    get:
      operationId: exportAccount
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /account:
    delete:
      operationId: deleteAccount
      responses:
        "200":
          description: Learning data removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /admin/me:
    get:
      operationId: getAdminAccess
      responses:
        "200":
          description: Current server-verified application role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccess" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Actual administrative totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/visitors:
    get:
      operationId: getAdminVisitors
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30], default: 30 } }
      responses:
        "200":
          description: Aggregated, consented visitor activity and learning profile segments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVisitors" }
  /visitor/pageview:
    post:
      operationId: recordVisitorPageview
      description: Records an anonymous page view only after optional analytics consent. Country is resolved from the Replit deployment proxy, never from the client request body. No IP address or account identifier is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitorPageviewInput" }
      responses:
        "202": { description: Accepted for aggregate reporting }
  /admin/users:
    get:
      operationId: getAdminUsers
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Paginated authentication directory and app controls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsers" }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: User controls saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
    delete:
      operationId: deleteAdminUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserDelete" }
      responses:
        "200":
          description: Authentication account and learning records deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /admin/users/{id}/access:
    put:
      operationId: setAdminUserAccess
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccessGrant" }
      responses:
        "200":
          description: Complimentary access saved, never a paid subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /admin/settings:
    get:
      operationId: getAdminSettings
      responses:
        "200":
          description: Application parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
    put:
      operationId: saveAdminSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSettings" }
      responses:
        "200":
          description: Application parameters saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
  /app-settings:
    get:
      operationId: getPublicSettings
      responses:
        "200":
          description: Public app status, without secrets or private controls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSettings" }
  /admin/lessons:
    get:
      operationId: getAdminLessons
      responses:
        "200":
          description: Editable curriculum including private answer keys
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminLesson" } }
  /admin/lessons/{id}:
    put:
      operationId: saveAdminLesson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLessonInput" }
      responses:
        "200":
          description: Lesson created or updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLesson" }
  /admin/audit:
    get:
      operationId: getAdminAudit
      responses:
        "200":
          description: Most recent 100 administrative actions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminAuditEntry" } }
components:
  schemas:
    AdminAccess:
      type: object
      required: [role, signedIn]
      properties:
        role: { type: string, enum: [owner, admin, learner] }
        signedIn: { type: boolean }
    AdminOverview:
      type: object
      required: [registeredUsers, learners, completedLessons, aiRequests, activeComplimentary, suspendedUsers, billingConfigured]
      properties:
        registeredUsers: { type: integer }
        learners: { type: integer }
        completedLessons: { type: integer }
        aiRequests: { type: integer }
        activeComplimentary: { type: integer }
        suspendedUsers: { type: integer }
        billingConfigured: { type: boolean }
    VisitorPageviewInput:
      type: object
      additionalProperties: false
      required: [visitorId, pageViewId, path, language]
      properties:
        visitorId: { type: string, format: uuid }
        pageViewId: { type: string, format: uuid }
        path: { type: string, pattern: "^/(?!admin(?:/|$))[A-Za-z0-9/_-]{0,120}$" }
        language: { type: string, enum: [ar, en, other] }
    AdminVisitorDaily:
      type: object
      required: [date, visitors, pageviews]
      properties:
        date: { type: string }
        visitors: { type: integer }
        pageviews: { type: integer }
    AdminVisitorCountry:
      type: object
      required: [country, visitors, pageviews]
      properties:
        country: { type: string }
        visitors: { type: integer }
        pageviews: { type: integer }
    AdminVisitorSegment:
      type: object
      required: [category, visitors]
      properties:
        category: { type: string }
        visitors: { type: integer }
    AdminLearningProfiles:
      type: object
      required: [totalLearners, levels, languages]
      properties:
        totalLearners: { type: integer }
        levels:
          type: array
          items: { $ref: "#/components/schemas/AdminVisitorSegment" }
        languages:
          type: array
          items: { $ref: "#/components/schemas/AdminVisitorSegment" }
    AdminVisitors:
      type: object
      required: [days, visitors, pageviews, daily, countries, devices, browsers, languages, learningProfiles]
      properties:
        days: { type: integer, enum: [7, 30] }
        visitors: { type: integer }
        pageviews: { type: integer }
        daily:
          type: array
          items: { $ref: "#/components/schemas/AdminVisitorDaily" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/AdminVisitorCountry" }
        devices:
          type: array
          items: { $ref: "#/components/schemas/AdminVisitorSegment" }
        browsers:
          type: array
          items: { $ref: "#/components/schemas/AdminVisitorSegment" }
        languages:
          type: array
          items: { $ref: "#/components/schemas/AdminVisitorSegment" }
        learningProfiles: { $ref: "#/components/schemas/AdminLearningProfiles" }
    AdminUser:
      type: object
      required: [id, email, emailVerified, displayName, role, suspended, createdAt, lastSignInAt, lessonsCompleted, xp, dailyGoal, accessPlan, accessExpiresAt, accessReason]
      properties:
        id: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        displayName: { type: string }
        role: { type: string, enum: [owner, admin, learner] }
        suspended: { type: boolean }
        createdAt: { type: string }
        lastSignInAt: { type: [string, "null"] }
        lessonsCompleted: { type: integer }
        xp: { type: integer }
        dailyGoal: { type: integer }
        accessPlan: { type: string, enum: [free, complimentary, monthly, six_month] }
        accessExpiresAt: { type: [string, "null"] }
        accessReason: { type: string }
        billingState: { type: string, enum: [not_started, trial, trial_expired, paid_monthly, paid_six_month, payment_pending, paid_expired, refunded, complimentary, suspended, admin] }
        trialStartedAt: { type: [string, "null"], format: date-time }
        trialEndsAt: { type: [string, "null"], format: date-time }
        monthlyPaymentCount: { type: integer }
        selectedPlan: { type: [string, "null"], enum: [trial, monthly, six_month, null] }
        lastPaymentVerifiedAt: { type: [string, "null"], format: date-time }
        billingVerificationStale: { type: boolean, description: Admin view is a recorded snapshot, not a fresh provider entitlement check }
        billingHistory:
          type: array
          items: { $ref: "#/components/schemas/AdminBillingRecord" }
    AdminBillingRecord:
      type: object
      required: [id, plan, status, priceUsd, checkoutId, createdAt, verifiedAt, accessStartsAt, accessUntil, paidUntil]
      properties:
        id: { type: string }
        plan: { type: string, enum: [monthly, six_month] }
        status: { type: string }
        priceUsd: { type: number, description: Listed course price, not a tax-inclusive receipt or proof of money received }
        checkoutId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        verifiedAt: { type: [string, "null"], format: date-time }
        accessStartsAt: { type: [string, "null"], format: date-time }
        accessUntil: { type: [string, "null"], format: date-time }
        paidUntil: { type: [string, "null"], format: date-time }
    AdminUsers:
      type: object
      required: [users, total, page, pageSize]
      properties:
