openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: Learner or guest profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      operationId: saveProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
  /courses:
    get:
      operationId: getCourses
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Course" } }
  /favourites:
    get:
      operationId: getFavourites
      tags: [Learning]
      description: Active saved lessons for the current account or signed guest session only.
      responses:
        "200":
          description: Saved lessons and conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lesson" }
  /favourites/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
    put:
      operationId: saveFavourite
      tags: [Learning]
      description: Idempotently save an active lesson under the server-resolved learner identity.
      responses:
        "204": { description: Saved }
        "404": { description: Lesson unavailable }
    delete:
      operationId: removeFavourite
      tags: [Learning]
      description: Idempotently remove this learner's save, including for an archived lesson.
      responses:
        "204": { description: Removed }
  /lessons/{id}:
    get:
      operationId: getLesson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lesson" }
  /lessons/{id}/complete:
    post:
      operationId: completeLesson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonSubmission" }
      responses:
        "200":
          description: Server graded result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonResult" }
  /progress/summary:
    get:
      operationId: getProgress
      responses:
        "200":
          description: Actual learning progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
  /study-schedule:
    put:
      operationId: saveStudySchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudyScheduleInput" }
      responses:
        "200":
          description: Saved scheduling preferences; lesson progress is unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400":
          description: Invalid schedule
  /study-plan:
    get:
      operationId: getStudyPlan
      responses:
        "200":
          description: Six month plan
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PlanDay" } }
  /vocabulary:
    get:
      operationId: getVocabulary
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Word" } }
  /vocabulary/{id}/review:
    post:
      operationId: reviewVocabulary
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Review scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Word" }
  /ai/chat:
    get:
      operationId: getChat
      responses:
        "200":
          description: Private tutor history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
    post:
      operationId: sendChat
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatInput" }
      responses:
        "200":
          description: Tutor reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
    delete:
      operationId: clearChat
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /billing/selection:
    post:
      operationId: selectCoursePlan
      tags: [learning]
      summary: Save a signed-in learner's plan preference without activating payment or restarting trial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanSelectionInput" }
      responses:
        "200":
          description: Saved preference and current access status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
        "400":
          description: Invalid plan
        "401":
          description: Sign in required
  /billing/reminder-device/{deviceId}/revoke:
    post:
      operationId: revokeReminderDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderRevocationInput" }
      responses:
        "204": { description: "Matching account-device consent revoked, including after account switches" }
  /billing/reminder-device/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getReminderDevice
      responses:
        "200":
          description: Delivery configuration and this account's device status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderDeviceStatus" }
    put:
      operationId: saveReminderDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderDeviceInput" }
      responses:
        "200":
          description: Consent saved for this installation and signed-in account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderDeviceStatus" }
    delete:
      operationId: removeReminderDevice
      responses:
        "204": { description: Background reminders disabled for this device }
  /billing/status:
    get:
      operationId: getBillingStatus
      responses:
        "200":
          description: Verified subscription state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
  /account/export:
    get:
      operationId: exportAccount
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /account:
    delete:
      operationId: deleteAccount
      responses:
        "200":
          description: Learning data removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /admin/me:
    get:
      operationId: getAdminAccess
      responses:
        "200":
          description: Current server-verified application role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccess" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Actual administrative totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/users:
    get:
      operationId: getAdminUsers
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Paginated authentication directory and app controls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsers" }
  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserUpdate" }
      responses:
        "200":
          description: User controls saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
    delete:
      operationId: deleteAdminUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserDelete" }
      responses:
        "200":
          description: Authentication account and learning records deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /admin/users/{id}/access:
    put:
      operationId: setAdminUserAccess
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccessGrant" }
      responses:
        "200":
          description: Complimentary access saved, never a paid subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /admin/settings:
    get:
      operationId: getAdminSettings
      responses:
        "200":
          description: Application parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
    put:
      operationId: saveAdminSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppSettings" }
      responses:
        "200":
          description: Application parameters saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
  /app-settings:
    get:
      operationId: getPublicSettings
      responses:
        "200":
          description: Public app status, without secrets or private controls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSettings" }
  /admin/lessons:
    get:
      operationId: getAdminLessons
      responses:
        "200":
          description: Editable curriculum including private answer keys
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminLesson" } }
  /admin/lessons/{id}:
    put:
      operationId: saveAdminLesson
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLessonInput" }
      responses:
        "200":
          description: Lesson created or updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLesson" }
  /admin/audit:
    get:
      operationId: getAdminAudit
      responses:
        "200":
          description: Most recent 100 administrative actions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminAuditEntry" } }
components:
  schemas:
    AdminAccess:
      type: object
      required: [role, signedIn]
      properties:
        role: { type: string, enum: [owner, admin, learner] }
        signedIn: { type: boolean }
    AdminOverview:
      type: object
      required: [registeredUsers, learners, completedLessons, aiRequests, activeComplimentary, suspendedUsers, billingConfigured]
      properties:
        registeredUsers: { type: integer }
        learners: { type: integer }
        completedLessons: { type: integer }
        aiRequests: { type: integer }
        activeComplimentary: { type: integer }
        suspendedUsers: { type: integer }
        billingConfigured: { type: boolean }
    AdminUser:
      type: object
      required: [id, email, emailVerified, displayName, role, suspended, createdAt, lastSignInAt, lessonsCompleted, xp, dailyGoal, accessPlan, accessExpiresAt, accessReason]
      properties:
        id: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        displayName: { type: string }
        role: { type: string, enum: [owner, admin, learner] }
        suspended: { type: boolean }
        createdAt: { type: string }
        lastSignInAt: { type: [string, "null"] }
        lessonsCompleted: { type: integer }
        xp: { type: integer }
        dailyGoal: { type: integer }
        accessPlan: { type: string, enum: [free, complimentary] }
        accessExpiresAt: { type: [string, "null"] }
        accessReason: { type: string }
    AdminUsers:
      type: object
      required: [users, total, page, pageSize]
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AdminUserUpdate:
      type: object
      required: [reason]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        dailyGoal: { type: integer, minimum: 5, maximum: 180 }
        role: { type: string, enum: [admin, learner] }
        suspended: { type: boolean }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AdminUserDelete:
      type: object
      required: [confirmationEmail, reason]
      properties:
        confirmationEmail: { type: string }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AdminAccessGrant:
      type: object
      required: [enabled, expiresAt, reason]
      properties:
        enabled: { type: boolean }
        expiresAt: { type: [string, "null"] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AppSettings:
      type: object
      required: [aiEnabled, learningEnabled, freeAiDailyLimit, complimentaryAiDailyLimit, defaultDailyGoal, announcementAr, announcementEn, supportEmail]
      properties:
        aiEnabled: { type: boolean }
        learningEnabled: { type: boolean }
        freeAiDailyLimit: { type: integer, minimum: 0, maximum: 200 }
        complimentaryAiDailyLimit: { type: integer, minimum: 0, maximum: 1000 }
        defaultDailyGoal: { type: integer, minimum: 5, maximum: 180 }
        announcementAr: { type: string, maxLength: 500 }
        announcementEn: { type: string, maxLength: 500 }
        supportEmail: { type: string, maxLength: 254 }
    PublicSettings:
      type: object
      required: [aiEnabled, learningEnabled, freeAiDailyLimit, complimentaryAiDailyLimit, announcementAr, announcementEn, supportEmail]
      properties:
        aiEnabled: { type: boolean }
        learningEnabled: { type: boolean }
        freeAiDailyLimit: { type: integer }
        complimentaryAiDailyLimit: { type: integer }
        announcementAr: { type: string }
        announcementEn: { type: string }
        supportEmail: { type: string }
    AdminLessonInput:
      type: object
      required: [courseId, sequence, active, content, answerKey, reason]
      properties:
        courseId: { type: string }
        sequence: { type: integer, minimum: 0, maximum: 10000 }
        active: { type: boolean }
        content: { type: object, additionalProperties: true }
        answerKey:
          type: array
          items:
            type: object
            required: [correctIndex, explanation]
            properties:
              correctIndex: { type: integer, minimum: 0, maximum: 8 }
              explanation: { type: string }
        reason: { type: string, minLength: 3, maxLength: 500 }
    AdminLesson:
      type: object
      required: [id, courseId, sequence, active, reviewStatus, content, answerKey, reason]
      properties:
        id: { type: string }
        courseId: { type: string }
        sequence: { type: integer }
        active: { type: boolean }
        reviewStatus: { type: string }
        content: { type: object, additionalProperties: true }
        answerKey:
          type: array
          items:
            type: object
            required: [correctIndex, explanation]
            properties:
              correctIndex: { type: integer }
              explanation: { type: string }
        reason: { type: string }
    AdminAuditEntry:
      type: object
      required: [id, actorId, action, targetId, detail, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string }
        action: { type: string }
        targetId: { type: string }
        detail: { type: object, additionalProperties: true }
        createdAt: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ProfileInput:
      type: object
      required: [displayName, level, goals, dailyGoal, timezone, reminderTime, reminderEnabled, language, onboardingComplete, retainChat]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        goals: { type: array, items: { type: string }, maxItems: 7 }
        dailyGoal: { type: integer, minimum: 5, maximum: 180 }
        timezone: { type: string }
        reminderTime: { type: string }
        reminderEnabled: { type: boolean }
        language: { type: string, enum: [ar, en] }
        onboardingComplete: { type: boolean }
        retainChat: { type: boolean }
    StudyScheduleInput:
      type: object
      required: [startDate, studyDays, paused, timezone]
      properties:
        startDate:
          type: [string, "null"]
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Local calendar date, or null for undated self-paced learning
        studyDays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 0, maximum: 6 }
          description: Sunday is 0; activities are distributed over these weekdays within 180 calendar days
        paused: { type: boolean }
        timezone: { type: string }
    StudySchedule:
      type: object
      required: [startDate, studyDays, pausedOn, pausedDays]
      properties:
        startDate: { type: string }
        studyDays:
          type: array
          items: { type: integer }
        pausedOn: { type: [string, "null"] }
        pausedDays: { type: integer }
    Profile:
      allOf:
        - { $ref: "#/components/schemas/ProfileInput" }
        - type: object
          required: [id, isGuest, joinedAt]
          properties:
            studySchedule:
              anyOf:
                - { $ref: "#/components/schemas/StudySchedule" }
                - { type: "null" }
            id: { type: string }
            isGuest: { type: boolean }
            joinedAt: { type: string }
    Word:
      type: object
      required: [id, amharic, arabic, english, transliteration, due, interval]
      properties:
        id: { type: string }
        amharic: { type: string }
        arabic: { type: string }
        english: { type: string }
        transliteration: { type: string }
        due: { type: boolean }
        interval: { type: integer }
    Exercise:
      type: object
      required: [id, prompt, options, type]
      properties:
        id: { type: string }
        prompt: { type: string }
        options: { type: array, items: { type: string } }
        type: { type: string }
    DialogueTurn:
      type: object
      required: [speakerAr, speakerEn, amharic, arabic, transliteration]
      properties:
        speakerAr: { type: string }
        speakerEn: { type: string }
        amharic: { type: string }
        arabic: { type: string }
        transliteration: { type: string, description: Approximate pronunciation in Arabic script }
    Lesson:
      type: object
      required: [id, courseId, titleAr, titleEn, titleAm, minutes, objective, explanation, words, exercises, reviewStatus, completed]
      properties:
        id: { type: string }
        courseId: { type: string }
        titleAr: { type: string }
        titleEn: { type: string }
        titleAm: { type: string }
        dialogue:
          type: array
          items: { $ref: "#/components/schemas/DialogueTurn" }
        minutes: { type: integer }
        objective: { type: string }
        explanation: { type: string }
        words: { type: array, items: { $ref: "#/components/schemas/Word" } }
        exercises: { type: array, items: { $ref: "#/components/schemas/Exercise" } }
        reviewStatus: { type: string }
        completed: { type: boolean }
    Course:
      type: object
      required: [id, titleAr, titleEn, description, level, category, month, lessons, completedCount]
      properties:
        id: { type: string }
        titleAr: { type: string }
        titleEn: { type: string }
        description: { type: string }
        level: { type: string }
        category: { type: string }
        month: { type: integer }
        lessons: { type: array, items: { $ref: "#/components/schemas/Lesson" } }
        completedCount: { type: integer }
    LessonSubmission:
      type: object
      required: [answers, activeSeconds]
      properties:
        answers: { type: array, items: { type: integer, minimum: 0, maximum: 8 } }
        activeSeconds: { type: integer, minimum: 0, maximum: 3600 }
    AnswerFeedback:
      type: object
      required: [correct, correctIndex, explanation]
      properties:
        correct: { type: boolean }
        correctIndex: { type: integer }
        explanation: { type: string }
    LessonResult:
      type: object
      required: [score, passed, xpEarned, feedback]
      properties:
        score: { type: integer }
        passed: { type: boolean }
        xpEarned: { type: integer }
        feedback: { type: array, items: { $ref: "#/components/schemas/AnswerFeedback" } }
    Progress:
      type: object
      required: [lessonsCompleted, totalLessons, vocabularyLearned, totalMinutes, todayMinutes, streak, xp, averageScore, activity, recentLessons]
      properties:
        lessonsCompleted: { type: integer }
        totalLessons: { type: integer }
        vocabularyLearned: { type: integer }
        totalMinutes: { type: number }
        todayMinutes: { type: number }
        streak: { type: integer }
        xp: { type: integer }
        averageScore: { type: number }
        activity: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        recentLessons: { type: array, items: { type: string } }
    Activity:
      type: object
      required: [date, minutes]
      properties:
        date: { type: string }
        minutes: { type: number }
    PlanDay:
      type: object
      required: [day, month, title, lessonId, type, completed]
      properties:
        suggestedDate: { type: ["string", "null"] }
        suggestedWeek: { type: ["integer", "null"] }
        currentSuggestedWeek: { type: ["integer", "null"] }
        overdue: { type: boolean }
        day: { type: integer }
        month: { type: integer }
        title: { type: string }
        lessonId: { type: ["string", "null"] }
        type: { type: string }
        completed: { type: boolean }
    ReviewInput:
      type: object
      required: [remembered]
      properties:
        remembered: { type: boolean }
    ChatInput:
      type: object
      required: [message, scenario]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        scenario: { type: string, maxLength: 100 }
    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        createdAt: { type: string }
    PlanSelectionInput:
      type: object
      required: [plan]
      properties:
        plan: { type: string, enum: [trial, monthly, six_month] }
    ReminderRevocationInput:
      type: object
      required: [revocationToken, bindingKey]
      properties:
        revocationToken: { type: string, format: uuid }
        bindingKey: { type: string, pattern: "^[0-9a-f]{64}$" }
    ReminderDeviceInput:
      type: object
      required: [channel, address, timezone, expectedUserId, revocationToken]
      properties:
        revocationToken: { type: string, format: uuid }
        expectedUserId: { type: string, minLength: 1, maxLength: 200, description: Reject enrollment if the signed-in identity changed while permission was being requested. }
        channel: { type: string, enum: [web, expo] }
        address: { type: string, minLength: 1, maxLength: 2048 }
        p256dh: { type: string, maxLength: 200 }
        auth: { type: string, maxLength: 100 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
    ReminderDeviceStatus:
      type: object
      required: [webConfigured, nativeConfigured, enabled, state, nextAt, lastResult, bindingKey]
      properties:
        bindingKey: { type: [string, "null"] }
        webConfigured: { type: boolean }
        nativeConfigured: { type: boolean }
        publicKey: { type: [string, "null"] }
        enabled: { type: boolean }
        state: { type: string, enum: [disabled, enabled, expired] }
        nextAt: { type: [string, "null"], format: date-time }
        lastResult: { type: [string, "null"], enum: [sending, accepted, confirmed, failed, unknown, null] }
    BillingStatus:
      type: object
      required: [plan, configured, message, trial, offers, enforcementEnabled, fullCourseAccess, reminder, isGuest]
      properties:
        plan: { type: string }
        selectedPlan:
          type: [string, "null"]
          enum: [trial, monthly, six_month, null]
          description: Learner preference only, never proof of a paid subscription
        configured: { type: boolean }
        message: { type: string }
        dailyAiLimit: { type: integer }
        accessExpiresAt: { type: [string, "null"] }
        source: { type: string, enum: [none, admin_grant] }
        isGuest: { type: boolean }
        enforcementEnabled: { type: boolean }
        fullCourseAccess: { type: boolean }
        trial: { $ref: "#/components/schemas/CourseTrial" }
        offers:
          type: array
          items: { $ref: "#/components/schemas/CourseOffer" }
        reminder:
          oneOf:
            - { $ref: "#/components/schemas/AccessReminder" }
            - { type: "null" }
    CourseTrial:
      type: object
      required: [state, startedAt, endsAt, daysRemaining]
      properties:
        state: { type: string, enum: [active, expired] }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        daysRemaining: { type: integer, minimum: 0, maximum: 2 }
    CourseOffer:
      type: object
      required: [id, priceUsd, durationMonths, billing, sixMonthTotalUsd, savingsUsd, savingsPercent]
      properties:
        id: { type: string, enum: [monthly, six_month] }
        priceUsd: { type: integer }
        durationMonths: { type: integer }
        billing: { type: string, enum: [monthly, one_time] }
        sixMonthTotalUsd: { type: integer }
        savingsUsd: { type: integer }
        savingsPercent: { type: number }
    AccessReminder:
      type: object
      required: [kind, expiresAt, daysRemaining, delivery]
      properties:
        kind: { type: string, enum: [complimentary_expiring, renewal_due, course_expiring] }
        expiresAt: { type: string, format: date-time }
        daysRemaining: { type: integer, minimum: 0, maximum: 4 }
        delivery: { type: string, enum: [in_app] }
